<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triết Học & CNXHKH — Hệ Thống Khảo Thí LMS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cg transform='rotate(-30 12 12)'%3E%3Ccircle cx='7.3' cy='3.2' r='1.45'/%3E%3Crect x='5.5' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Crect x='14.9' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Ccircle cx='16.7' cy='20.8' r='1.45'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['"Instrument Serif"', 'Georgia', 'serif'],
            anton: ['Anton', 'sans-serif'],
            display: ['Anton', 'sans-serif'],
          },
          colors: {
            primary: '#22d3ee', // Cyan
            secondary: '#38bdf8',
            accent: '#a855f7',
            success: '#10b981',
            error: '#ef4444',
          },
          animation: {
            'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-in-left': 'slideInLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideInRight: {
              '0%': { opacity: '0', transform: 'translateX(16px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
            slideInLeft: {
              '0%': { opacity: '0', transform: 'translateX(-16px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
          }
        }
      }
    }
  </script>

  <style>
    /* Force black immediately so the page can never flash white */
    html, body { 
      background: #000000 !important; 
      color: #ffffff; 
    }

    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #9a9a9a;
      --stat: #d8d8d8;
      --border: rgba(255, 255, 255, 0.16);
      --border-soft: rgba(255, 255, 255, 0.12);
      --color-primary: 34 211 238; /* Cyan */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #000000;
      background: var(--bg, #000000);
      color: #ffffff;
      color: var(--text, #ffffff);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Serif italic accent font */
    .font-serif-accent {
      font-family: "Instrument Serif", "Times New Roman", Times, serif;
      font-style: italic;
    }

    /* Noise grain overlay */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 99;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Liquid Glass Panels */
    .glass-panel {
      background: rgba(12, 16, 28, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.5);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Liquid Metal Pill */
    .liquid-pill {
      border: 1px solid rgba(198, 198, 198, 0.45);
      background: linear-gradient(105deg, #050505 0%, #222222 48%, #3a3a3a 100%);
      color: #f3f3f3;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
    }

    .liquid-pill::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.16) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.6s ease;
    }

    .liquid-pill:hover::before {
      transform: translateX(120%);
    }

    .liquid-pill:hover {
      border-color: rgba(235, 235, 235, 0.85);
      background: linear-gradient(105deg, #111111 0%, #333333 45%, #555555 100%);
      box-shadow: 0 0 18px rgba(200, 210, 230, 0.18);
    }

    /* Vesper Solid & Ghost Buttons */
    .btn-solid {
      background: linear-gradient(180deg, #ffffff 0%, #e7e7e7 48%, #cfcfcf 100%);
      color: #111111;
      border: 1px solid #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
      position: relative;
      overflow: hidden;
      transition: all 0.35s ease;
    }

    .btn-solid::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.45) 48%, transparent 76%);
      transform: translateX(-130%);
      transition: transform 0.65s ease;
    }

    .btn-solid:hover::after {
      transform: translateX(130%);
    }

    .btn-solid:hover {
      background: linear-gradient(180deg, #ffffff 0%, #f3f6ff 42%, #d5def2 100%);
      border-color: #f2f6ff;
      box-shadow: inset 0 1px 0 #ffffff, 0 0 24px rgba(186, 208, 255, 0.38), 0 8px 18px rgba(255, 255, 255, 0.14);
    }

    .btn-ghost {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.45) 50%, rgba(160, 175, 200, 0.08));
      color: #ffffff;
      border: 1px solid rgba(198, 198, 198, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
      transition: all 0.35s ease;
    }

    .btn-ghost::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.35) 48%, transparent 76%);
      transform: translateX(-130%);
      transition: transform 0.65s ease;
    }

    .btn-ghost:hover::after {
      transform: translateX(130%);
    }

    .btn-ghost:hover {
      background: linear-gradient(135deg, rgba(210, 225, 255, 0.18), rgba(0, 0, 0, 0.35) 48%, rgba(180, 195, 220, 0.16));
      border-color: rgba(220, 230, 255, 0.75);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 20px rgba(170, 200, 255, 0.22);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444444;
    }
  </style>
</head>
<body style="background:#000;color:#fff">
  <div class="grain"></div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
